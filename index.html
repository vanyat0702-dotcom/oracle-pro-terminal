<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE PRO — Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 👇 Исправление разрывов/смещения свечей и аппаратное сглаживание -->
    <style>
      /* Жесткая фиксация координат Canvas и фреймов, убирающая вертикальный гэп свечей */
      iframe, canvas {
        display: block !important;
        vertical-align: top !important;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* Точная привязка виджета TradingView к размерам контейнера */
      div[class*="tradingview"], #chart-container iframe {
        height: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
